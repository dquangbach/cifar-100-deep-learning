[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "cifar-classifier"
version = "0.1.0"
description = "CIFAR-100 classification with Wide ResNet-16-4"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.15,<3",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "h5py>=3.8",
]

[project.scripts]
cifar-classifier = "cifar_classifier.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

